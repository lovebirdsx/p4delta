# 分发出去的是拷贝式的独立 exe：静态链接 CRT，目标机器才不需要另外装
# VC++ 2015-2022 可再发行组件（动态链接时导入表里会有 VCRUNTIME140.dll，而
# Windows 只自带 UCRT）。只对 Windows MSVC 目标生效，Linux/macOS 的构建不受影响。
#
# 注意 RUSTFLAGS 环境变量会整份覆盖这里的 rustflags，CI 里不要设它；
# release.yml 有一条「exe 字节里不该出现 VCRUNTIME140」的断言做护栏。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# 将来发 ARM64 版时同样处理：
# [target.aarch64-pc-windows-msvc]
# rustflags = ["-C", "target-feature=+crt-static"]
