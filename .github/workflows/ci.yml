name: CI

on:
  push:
    # branches 必须写：GitHub 只在定义了 branches/tags 的**那一类** ref 上触发，
    # 只写 tags-ignore 会让分支推送也不再跑 CI。这里要的是「分支照跑、tag 不跑」——
    # tag 推送交给 release.yml，它会把下面三个 job 当门禁复用一遍，不必跑两回。
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  # 供 release.yml 当发布门禁复用。
  workflow_call:

# 同一分支连续推送时取消尚未跑完的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # 钉 24.04 而不是 ubuntu-latest：后者 2026-10-19 起迁往 Ubuntu 26，那次迁移会连
    # glibc 与预装工具链一起换掉，让 CI 在与代码无关的日子里整体漂移。下面几个
    # ubuntu job 同此。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # -D warnings 是硬门禁：有警告即失败，不靠人工 review 拦。
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    strategy:
      # Windows 挂而别的平台过时，两边的结果都要能看到。
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # e2e 要在真实的 Perforce 服务器上跑，而 runner 上什么都没有。
      # 脚本会校验 SHA256 并冒烟，任一步失败即整个 job 失败——
      # 下载不到就让 CI 红，不能静默退化成「e2e 全部跳过」而看起来是绿的。
      - name: Install p4 and p4d
        shell: bash
        run: bash scripts/fetch-p4-tools.sh
      # nextest 而不是 cargo test：cargo 逐个测试二进制串行执行，nextest 则把所有目标的
      # 用例放进同一个调度池。行为差异与各项配置
      # 见 .config/nextest.toml。装的是预编译包，不在 CI 上现编一遍。
      - uses: taiki-e/install-action@nextest
      # 找不到 p4d 时 e2e 会打印一行 skipping 后整段跳过，测试仍然全绿——
      # 那是个「什么都没验证」的成功。安装脚本失败已经会让 job 红，但那只
      # 保证下载没出错，保证不了二进制真的能用。P4_E2E_REQUIRED 补上这道防线：
      # 设了它，跳过就是失败。
      - name: Run tests
        env:
          P4_E2E_REQUIRED: "1"
          # p4 只落在 vendor/，既不在 runner 的 PATH 也不在 P4V 安装目录，不指给它，
          # src/test_util.rs 的 p4_available() 就会让依赖真实 p4 的单测一路静默跳过——
          # 一场绿色的空跑。后缀跟着平台走，只有 Windows 的二进制带 .exe。
          P4_EXE: ${{ github.workspace }}/vendor/p4${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo nextest run --all-targets --all-features --locked
      # 默认档用 default-filter 排掉了那条 Windows 专用的失败注入用例——它要跑十来秒，
      # 且并行度救不了它（理由写在 .config/nextest.toml 里）。这里补跑回来，门禁才不缺这一环。
      # 不写 if 的话 Linux/macOS 上匹配到 0 条用例，而 --no-tests 默认 fail（退出码 4）会让
      # job 红；反过来在 Windows 上保留这个 fail 行为，用例被改名后会立刻暴露，不会悄悄退化成不跑。
      - name: Run the default-filter-excluded test
        if: runner.os == 'Windows'
        env:
          P4_E2E_REQUIRED: "1"
          P4_EXE: ${{ github.workspace }}/vendor/p4.exe
        run: >
          cargo nextest run --all-targets --all-features --locked
          --ignore-default-filter
          -E 'test(=both_delete_legs_report_their_own_failure)'

  # 摘要并行段的栈边界：`tests/e2e_stack.rs` 那两条用例只在 release 档成立（dev 档里
  # 128 KiB 读缓冲不进递归帧，修复前也是绿的——实测同一份修复前源码 dev 档 2/2 过、
  # release 档 2/2 崩），所以默认档用 default-filter 整段排掉，由这个 job 用
  # `--ignore-default-filter` 补跑。
  #
  # 平台要 ubuntu 与 Windows 两条腿，macOS 不要：
  # - 原始报告就是 Windows（退出码 0xC00000FD），而 test 矩阵里 Windows 那份跑的是 debug
  #   档、对这条 bug 恒绿——不加这条腿，出事的那个平台等于没有运行时覆盖；
  # - Windows 这条腿有真实的红：修复前的 release 构建在用例参数下（1 MiB 栈 + 1000 文件）
  #   实测 3/3 崩，修复后 3/3 过，不是碰运气的绿；
  # - macOS 给不出 debug 档给不了的信息（同样的 Mach-O 栈探测、同样的 2 MiB 默认栈），
  #   一份 release 构建不便宜，不值得为它再买一条腿。
  test-stack-release:
    strategy:
      # 一条腿挂了另一条腿的结果也要能看到（与 test job 同）。
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install p4 and p4d
        shell: bash
        run: bash scripts/fetch-p4-tools.sh
      - uses: taiki-e/install-action@nextest
      # `--release` 让 assert_cmd 解析到 target/release/p4delta（它读 CARGO_BIN_EXE_<name>），
      # 测试代码一行都不用改。`--no-tests` 默认 fail 正好当护栏：用例被改名后匹配到 0 条，
      # job 立刻红，不会悄悄退化成不跑。
      - name: Run the stack-boundary tests against the release build
        env:
          P4_E2E_REQUIRED: "1"
          # 后缀跟着平台走，只有 Windows 的二进制带 .exe（与 test job 同）。
          P4_EXE: ${{ github.workspace }}/vendor/p4${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >
          cargo nextest run --release --all-targets --all-features --locked
          --ignore-default-filter
          -E 'binary(e2e_stack)'

  # 安装脚本的黑盒测试：把 install.ps1 与一个人造 exe 拷进临时目录再跑，
  # 断言生成的 customtools.xml 与幂等/卸载行为。不需要构建产物，所以独立于 test。
  # 最后一条用例会临时改写 runner 上的 HKCU\Environment\Path（验默认加 PATH、卸载摘掉，
  # 先快照、finally 还原）——一次性环境，用完还回去；其余用例一律带 -WithoutPath。
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 用户机器上的默认解释器是 Windows PowerShell 5.1，开发机上多半是 7。
      # 两边都跑：install.ps1 要同时兼容（比如 5.1 没有 ?? 和 utf8NoBOM），
      # 而它对中文输出的依赖（脚本必须带 UTF-8 BOM）只有 5.1 这一遍能验出来。
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: install.ps1 under PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1
      - name: Preview benchmark script under PowerShell 7
        shell: pwsh
        run: ./scripts/test-benchmark.ps1

  # release.sh 的黑盒测试：在一次性 git 仓库里真跑一遍改版本号、提交、打附注 tag、推送，
  # 只有 cargo 换成垫片——所以不需要构建产物，也不联网。
  release-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-release.sh
