[package]
name = "p4delta"
version = "0.1.7"
edition = "2024"
# 代码里用了 let-chains（if let ... && let ...），Rust 1.88 起稳定，
# 高于 edition 2024 自身的 1.85 下限。
rust-version = "1.88"
authors = ["lovebirdsx"]
# 这一句同时是 `--help` 的简介（cli.rs 的 #[command(about)] 取它）与 GitHub 仓库的 About，
# 改的时候两处都要跟——仓库里只有这一份副本，别再手抄一份到别处。
description = "Perforce Helix Core workspace tool: reconcile, clean and sync — 10–100× faster than P4V's Reconcile Offline Work, with path scoping and dry-run by default."
license = "MIT"
repository = "https://github.com/lovebirdsx/p4delta"
readme = "README.md"
# 这是给 P4V 调用的内部工具，不作为库发布。
publish = false

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
clap = { version = "4.5.51", features = ["derive"] }
walkdir = "2.5.0"
md-5 = "0.11.0-rc.3"
rayon = "1.11.0"
async-global-executor = "2.4.1"
async-process = "2.5.0"
futures = "0.3.31"
hex = "0.4.3"
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.7"
humansize = "2.1.3"
bincode = "2.0.1"
directories = "6.0.0"
# 只用 trait（de 侧），不用 derive：`.p4delta-scope` 的严格解析要在自己的 Visitor 里
# 拒掉重复键——serde_json 默认「后来的键赢」，而配置里一个重复的 `include` 会静默换掉
# 整份范围，那是 fail-open 的方向。
serde = "1.0.228"
serde_json = "1.0.145"

[build-dependencies]
embed-resource = "2.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.dev]
# 默认的 debug = 2 让每个测试二进制的 .pdb 涨到 15–18MB，链接是构建时间的大头。
# line-tables-only 保住 anyhow backtrace 要用的文件名与行号，体积和链接时间都大幅下降。
# test profile 继承 dev，所以这一条对 cargo test / cargo nextest 同样生效。
debug = "line-tables-only"

[profile.release]
# 发布的是单个 exe：LTO 与单 codegen unit 换体积和运行速度。strip 只去 debuginfo，
# 不去符号表——anyhow 的 backtrace 还要靠函数名，出问题时用户才能给出可读的调用栈。
lto = "thin"
codegen-units = 1
strip = "debuginfo"
